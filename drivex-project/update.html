<html lang="en" style="scroll-behavior: auto;">
	<head>
		<meta charset="UTF-8">
		<link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96">
		
		

		
		<title>Plan-Market</title>
		<style>
		@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap");
:root {
  --market-bg-color: #fafafa;
  --market-grid-color: rgba(0, 0, 0, 0.08);
  --market-object-color: rgba(0, 0, 0, 0.1);
  --market-object-soft: rgba(0, 0, 0, 0.05);
  --market-transition-slow: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  --market-transition-fast: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.market-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background-color: var(--market-bg-color);
  pointer-events: none;
}

.market-grid {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.grid-line {
  position: absolute;
  background-color: var(--market-grid-color);
  transition:
    transform var(--market-transition-slow),
    opacity var(--market-transition-fast);
}

.grid-line.horizontal {
  width: 100%;
  height: 1px;
  transform: scaleX(0.3);
  transform-origin: left;
}

.grid-line.vertical {
  width: 1px;
  height: 100%;
  transform: scaleY(0.3);
  transform-origin: top;
}

.market-bg-objects {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.market-bg-object {
  position: absolute;
  opacity: 0.3;
  transition:
    transform var(--market-transition-slow),
    opacity var(--market-transition-slow);
}

.market-bg-object.circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 1px solid var(--market-object-color);
  bottom: 40px;
  left: -30px;
  transform: translateY(20px);
}

.market-bg-object.square {
  width: 60px;
  height: 60px;
  border: 1px solid var(--market-object-color);
  top: 40px;
  right: 30px;
  transform: rotate(45deg) translateY(-20px);
}

.market-bg-object.triangle {
  width: 0;
  height: 0;
  border-left: 40px solid transparent;
  border-right: 40px solid transparent;
  border-bottom: 70px solid var(--market-object-soft);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
}
</style></hed>
<body>
	
<div class="market-bg">
  <div class="market-grid">
    <div class="grid-line horizontal" style="top: 25%"></div>
    <div class="grid-line horizontal" style="top: 50%"></div>
    <div class="grid-line horizontal" style="top: 75%"></div>
    <div class="grid-line vertical" style="left: 33.33%"></div>
    <div class="grid-line vertical" style="left: 66.66%"></div>
  </div>

  <div class="market-bg-objects">
    <div class="market-bg-object circle"></div>
    <div class="market-bg-object square"></div>
    <div class="market-bg-object triangle"></div>
  </div>
</div>
		
	</body>
	</html>
